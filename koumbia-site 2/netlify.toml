[build]
  command = "npm run build"
  publish = "_site"

# En-têtes de sécurité envoyés par Netlify sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://cdn.tailwindcss.com https://identity.netlify.com 'unsafe-inline'; connect-src 'self' https://api.netlify.com"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
